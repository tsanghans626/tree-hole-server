spring:
  application:
    name: "treeholeserver"
  profiles:
    active: dev
  ai:
    openai:
      base-url: "https://api.hunyuan.cloud.tencent.com"
      chat:
        options:
          model: "hunyuan-2.0-instruct-20251111"
          temperature: 0.7
  datasource:
    driver-class-name: org.postgresql.Driver

  # Redis 配置
  data:
    redis:
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # Cache 配置
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "tree-hole:"

# MyBatis Plus Configuration
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lwznkj.treeholeserver.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# Authentication white list configuration
auth:
  white-list:
    paths:
      - /api/v1/auth/**
