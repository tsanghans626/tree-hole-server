spring:
  application:
    name: "treeholeserver"
  profiles:
    active: dev
  datasource:
    url: "jdbc:postgresql://localhost:5432/treehole"
    username: "treehole"
    password: "qwer1234"
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      base-url: "https://api.hunyuan.cloud.tencent.com"
      api-key: "sk-4fSNaSE9emCJhNS80uB6yoyDCz6ZIdIQ4dQPr2AL2nWxFmK2"
      chat:
        options:
          model: "hunyuan-2.0-instruct-20251111"
          temperature: 0.7
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  # Cache 配置
  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      key-prefix: "tree-hole:"

jwt:
  secret: "tree-hole-server-secret-key-change-in-production-256bits"
  expiration: 86400000  # 24 hours (in milliseconds)

# Authentication white list configuration
auth:
  white-list:
    paths:
      - /api/v1/auth/**
